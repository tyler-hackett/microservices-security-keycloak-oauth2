services:
  caf-database:
    image: caf/caf-database
    ports:
      - "5432:5432"
    networks:
      caf-bridge:
        aliases:
          - caf-database
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  s3local:
    image: localstack/localstack:4.9.2
    ports:
      - "4566:4566"
    networks:
      caf-bridge:
        aliases:
          - s3local
    environment:
      SERVICES: s3
      START_WEB: 0

  caf-thumbnail:
    image: caf/caf-thumbnail:1.0.0
    ports:
      - "4040:8080"
    networks:
      caf-bridge:
        aliases:
          - caf-thumbnail
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://s3local:4566
      QUARKUS_MP_JWT_VERIFY_ISSUER: http://${KC_HOSTNAME}:9090/realms/caf-realm
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  caf-rest:
    image: caf/caf-rest:1.0.0
    ports:
      - "5050:8080"
    networks:
      caf-bridge:
        aliases:
          - caf-rest
    environment:
      QUARKUS_DATASOURCE_USERNAME: cafuser
      QUARKUS_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://caf-database:5432/caf
      QUARKUS_OIDC_AUTH_SERVER_URL: http://${KC_HOSTNAME}:9090/realms/caf-realm
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${CAF_REST_CLIENT_SECRET}
      CAF_JWT_ISSUER: http://${KC_HOSTNAME}:9090/realms/caf-realm
      CAF_JWT_AUDIENCE: caf-thumbnail
    secrets:
      - caf_rest_jwt_key
    depends_on:
      caf-database:
        condition: service_healthy
        restart: true
      caf-thumbnail:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  caf-webapp:
    image: caf/caf-webapp:1.0.0
    ports:
      - "8080:8080"
    networks:
      caf-bridge:
        aliases:
          - caf-webapp
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      QUARKUS_S3_ENDPOINT_OVERRIDE: http://s3local:4566
      QUARKUS_OIDC_AUTH_SERVER_URL: http://${KC_HOSTNAME}:9090/realms/caf-realm
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${CAF_WEBAPP_CLIENT_SECRET}
      QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL: http://${KC_HOSTNAME}:9090/realms/caf-realm
      QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET: ${CAF_WEBAPP_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KC_HOSTNAME: ${KC_HOSTNAME}
    depends_on:
      caf-rest:
        condition: service_healthy
        restart: true

secrets:
  caf_rest_jwt_key:
    file: privateKey.pem

networks:
  caf-bridge:
    external: true
    name: caf-network
